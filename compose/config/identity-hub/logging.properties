# java.util.logging configuration, named on the image's CMD as
# -Djava.util.logging.config.file=/app/logging.properties. It must exist.
#
# Raise org.eclipse.edc.level to ALL and .level to DEBUG when diagnosing a boot
# failure; INFO is the right default for a running connector.
.level=INFO
org.eclipse.edc.level=INFO
org.eclipse.dse.level=INFO
handlers=java.util.logging.ConsoleHandler
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter
java.util.logging.ConsoleHandler.level=ALL
java.util.logging.SimpleFormatter.format=[%1$tY-%1$tm-%1$td %1$tH:%1$tM:%1$tS] [%4$-7s] %5$s%6$s%n
