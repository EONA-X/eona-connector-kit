# OpenTelemetry Java agent configuration.
#
# The agent is baked into the image and attached on every start by the image's
# own CMD (-javaagent:/app/opentelemetry-javaagent.jar), so this file must exist
# even when telemetry is off. Disabled by default: the kit ships no collector.
#
# To export traces, set otel.javaagent.enabled=true and add the exporter
# settings for your backend, e.g.
#   otel.traces.exporter=otlp
#   otel.exporter.otlp.endpoint=http://your-collector:4317
#   otel.service.name=<participant>-<component>
otel.javaagent.enabled=false
otel.javaagent.debug=false
